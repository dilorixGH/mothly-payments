<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Monthly Payments</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #0b0c10;
    --card: #1a1c22;
    --accent: #4f8cff;
    --text: #f5f7ff;
    --muted: #8b90a3;
    --radius: 14px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden; /* убираем прокрутку */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: 390px; /* iPhone 13 Pro */
    height: 100%;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
  }

  .summary {
    background: var(--card);
    padding: 14px;
    border-radius: var(--radius);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
  }

  .list {
    flex: 1;
    overflow-y: auto;
    padding-right: 6px;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 20px;
    font-size: 14px;
  }

  .item {
    background: var(--card);
    padding: 12px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    cursor: pointer;
  }

  .item-header {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
  }

  .item-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  .btn {
    padding: 6px 10px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-size: 13px;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-danger {
    background: #ff4f6a33;
    color: #ffb3c0;
  }

  .form {
    background: var(--card);
    padding: 14px;
    border-radius: var(--radius);
  }

  .form-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
  }

  .form-row label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .form-row input {
    padding: 8px;
    border-radius: var(--radius);
    border: 1px solid #2a2d36;
    background: #111217;
    color: var(--text);
  }

  .form-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
  }
</style>
</head>

<body>
<div class="app">

  <div class="title">Monthly Payments</div>

  <div class="summary">
    <div class="summary-row">
      <span>Ежемесячно:</span>
      <span id="sum-total">€0</span>
    </div>
    <div class="summary-row" style="margin-top:6px;">
      <span>Подписок:</span>
      <span id="sum-count">0</span>
    </div>
  </div>

  <div class="list" id="list">
    <div class="empty" id="empty">Нет подписок</div>
  </div>

  <div class="form">
    <div class="form-row">
      <label>Название</label>
      <input id="name" placeholder="Netflix">
    </div>

    <div class="form-row">
      <label>Цена (€)</label>
      <input id="price" type="number" step="0.01">
    </div>

    <div class="form-row">
      <label>Оплачено до</label>
      <input id="date" type="date">
    </div>

    <div class="form-footer">
      <button class="btn" id="reset">Сброс</button>
      <button class="btn btn-primary" id="save">Добавить</button>
    </div>
  </div>

</div>

<script>
function vibrate(p=[10]) { if (navigator.vibrate) navigator.vibrate(p); }

let subs = JSON.parse(localStorage.getItem("mp-data") || "[]");
let editId = null;

const list = document.getElementById("list");
const empty = document.getElementById("empty");
const sumTotal = document.getElementById("sum-total");
const sumCount = document.getElementById("sum-count");

const nameEl = document.getElementById("name");
const priceEl = document.getElementById("price");
const dateEl = document.getElementById("date");
const saveBtn = document.getElementById("save");
const resetBtn = document.getElementById("reset");

function render() {
  list.innerHTML = "";
  if (subs.length === 0) {
    list.appendChild(empty);
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
    subs.forEach(s => {
      const item = document.createElement("div");
      item.className = "item";

      item.innerHTML = `
        <div class="item-header">
          <span>${s.name}</span>
          <span>€${Number(s.price).toFixed(2)}</span>
        </div>
        <div class="item-meta">
          ${s.date ? "Оплачено до: " + s.date : "Дата не указана"}
        </div>
        <div class="actions">
          <button class="btn btn-primary">Изменить</button>
          <button class="btn btn-danger">Удалить</button>
        </div>
      `;

      const [editBtn, delBtn] = item.querySelectorAll("button");

      editBtn.onclick = () => {
        vibrate();
        editId = s.id;
        nameEl.value = s.name;
        priceEl.value = s.price;
        dateEl.value = s.date;
        saveBtn.textContent = "Сохранить";
      };

      delBtn.onclick = () => {
        vibrate([20]);
        subs = subs.filter(x => x.id !== s.id);
        save();
      };

      list.appendChild(item);
    });
  }

  const total = subs.reduce((a, b) => a + Number(b.price || 0), 0);
  sumTotal.textContent = "€" + total.toFixed(2);
  sumCount.textContent = subs.length;
}

function save() {
  localStorage.setItem("mp-data", JSON.stringify(subs));
  render();
}

saveBtn.onclick = () => {
  vibrate();

  const name = nameEl.value.trim();
  const price = Number(priceEl.value || 0);
  const date = dateEl.value || null;

  if (!name) return alert("Введите название");

  if (editId) {
    const s = subs.find(x => x.id === editId);
    s.name = name;
    s.price = price;
    s.date = date;
    editId = null;
    saveBtn.textContent = "Добавить";
  } else {
    subs.push({
      id: Date.now(),
      name,
      price,
      date
    });
  }

  nameEl.value = "";
  priceEl.value = "";
  dateEl.value = "";

  save();
};

resetBtn.onclick = () => {
  vibrate();
  editId = null;
  nameEl.value = "";
  priceEl.value = "";
  dateEl.value = "";
  saveBtn.textContent = "Добавить";
};

render();
</script>

</body>
</html>
