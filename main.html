<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет трат</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <div class="app-header">Ежемесячные траты</div>

    <div class="app-total">
        <div class="app-total-title">Общая сумма</div>
        <div class="app-total-value" id="totalValue">0 €</div>
    </div>

    <div class="app-form">
        <input class="app-form-input app-form-input-name" id="inputName" placeholder="Название траты">
        <input class="app-form-input app-form-input-sum" id="inputSum" placeholder="Сумма (₽)" type="number">
        <input class="app-form-input app-form-input-date" id="inputDate" placeholder="Выбрать дату" readonly>
        <button class="app-form-btn" id="btnAdd">Добавить / Изменить</button>
    </div>

    <div class="app-list" id="list"></div>
</div>

<div id="calendarModal" class="calendar-modal">
    <div class="calendar-window">
        <div class="calendar-header">
            <button id="prevMonth">‹</button>
            <span id="calendarMonth"></span>
            <button id="nextMonth">›</button>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
