<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет трат</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <div class="app-header">Ежемесячные траты</div>

    <div class="app-total">
        <div class="app-total-title">Общая сумма</div>
        <div class="app-total-value" id="totalValue">0 €</div>
    </div>

    <div class="app-form">
        <input class="app-form-input app-form-input-name" id="inputName" placeholder="Название траты">
        <input class="app-form-input app-form-input-sum" id="inputSum" placeholder="Сумма (₽)" type="number" inputmode="numeric">
        <input class="app-form-input app-form-input-date" id="inputDate" placeholder="Выбрать дату" readonly>
        <button class="app-form-btn" id="btnAdd">Добавить / Изменить</button>
    </div>

    <div class="app-list" id="list"></div>
</div>

<div id="calendarModal" class="calendar-modal">
    <div class="calendar-window">
        <div class="calendar-header">
            <button id="prevMonth">‹</button>
            <span id="calendarMonth"></span>
            <button id="nextMonth">›</button>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
    </div>
</div>

<div id="warningScreen" class="warning-screen">
    <div class="warning-window">
        <div class="warning-title">
            <svg width="50px" height="50px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.9998 8.99999V13M11.9998 17H12.0098M10.6151 3.89171L2.39019 18.0983C1.93398 18.8863 1.70588 19.2803 1.73959 19.6037C1.769 19.8857 1.91677 20.142 2.14613 20.3088C2.40908 20.5 2.86435 20.5 3.77487 20.5H20.2246C21.1352 20.5 21.5904 20.5 21.8534 20.3088C22.0827 20.142 22.2305 19.8857 22.2599 19.6037C22.2936 19.2803 22.0655 18.8863 21.6093 18.0983L13.3844 3.89171C12.9299 3.10654 12.7026 2.71396 12.4061 2.58211C12.1474 2.4671 11.8521 2.4671 11.5935 2.58211C11.2969 2.71396 11.0696 3.10655 10.6151 3.89171Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="warning-text">
            Этот сайт не использует аккаунты.  
            Все данные сохраняются только на вашем устройстве.  
            Если вы очистите данные браузера - все ваши записи исчезнут.
            <br><br>
            <i>Если вы видите это окно снова, значит данные были сброшены.</i>
        </div>
        <button id="warningOk" class="warning-btn">Понятно</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
